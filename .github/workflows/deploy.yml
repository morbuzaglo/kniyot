# עדכון קטלוג: מייבא מהרשתות, שומר ב-main ומפרסם את app/ לענף gh-pages (שממנו GitHub Pages מגיש את האתר).
# הפעלה ידנית: Actions ← update-catalog ← Run workflow. רץ גם אוטומטית כל יום ראשון.
# הערה: ייתכן שאתרי הרשתות חוסמים שרתים מחוץ לישראל; במקרה כזה הריצו מהמחשב: npm run update
name: update-catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund || true
      - run: npm test
      - name: Import catalog
        run: node importer/import.mjs --max-stores 3 --enrich-off --off-limit 1500 || echo "::warning::הייבוא הסתיים עם שגיאות — ראו importer/data/import-report.json"
      - name: Show report
        run: cat importer/data/import-report.json | head -80 || true
      - name: Commit and publish
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add app/catalog importer/data
          git commit -m "catalog: עדכון אוטומטי" || echo "אין שינויים"
          git push origin HEAD:main
          git subtree split --prefix app -b pages-tmp
          git push -f origin pages-tmp:gh-pages
